# Vídeo "1014" (versão do Drive de 14/10 19:22, 57 s) — "Startup é caro?": 3 passos para validar a ideia gastando pouco.
# Padrão do CONTEXTO.md (headline + motions "produto" + receita do vídeo 3 + estúdio + página de entrega).
# Uso: python editar.py entrada/video6_ordem.mov --estilo referencia1 --plataforma reels --config config/planos/video6_startup.yaml
# entrada/video6_ordem.mov = bruto com o fim reordenado: a frase "Agora, se você ainda acha que startup é caro," estava
# gravada DEPOIS do "Já me segue... vai te ajudar" e foi colocada antes dele (o vídeo terminava numa frase cortada).
# Pedido desta edição: motions mais CENTRALIZADOS (na edição anterior ficavam à esquerda e "perdiam" a borda na entrada).
cortes:
  jump_zoom: {ativo: true, modo: variado, zoom_niveis: [1.0, 1.07, 1.0, 1.12, 1.04], dividir_max_s: 2.6}
legendas:
  estilos:
    cinetico: {posicao: peito}
sfx:                                    # nível aprovado (vídeo 3)
  intervalo_min_s: 0.9
  max_por_minuto: 30
  volume_rel_voz_db: -9
silencio:
  pausa_preservada_s: 0.22
motion:
  contador: {ativo: false}
dinamismo:
  ativo: true
  intervalo_s: 2.6
  gap_min_s: 0.9
  inicio_livre_s: 0.0
  auto_palavras: false
  fotos_entidades: false
  cards_max: 0
  plano:
    # 0) headline: orador numa janela que abre para a tela cheia (rosto fica alto no quadro → foco 0.3)
    - t: 0.0
      tipo: motion
      formato: janela
      janela:
        borda: false
        foco: [0.5, 0.3]
        quadros:
          - {t: 0.0, x: 0.5, y: 0.6073, w: 0.8, h: 0.3125, r: 0.022}
          - {t: 2.8, x: 0.5, y: 0.6073, w: 0.8, h: 0.3125, r: 0.022}
          - {t: 3.3, x: 0.5, y: 0.5, w: 1.0, h: 1.0, r: 0.0}
      roteiro: {titulo: headline, modelo: produto, pre_roll: 0, cenas: [{tipo: headline, dur: 3.4, janela_px: [108, 866, 864, 600],
                rotulo: "STARTUP · SEM QUEIMAR DINHEIRO", titulo: "Valide sua startup *gastando pouco.*", anos: ["IDEIA", "VENDA"]}]}
    # "Muita gente diz que startup é caro, e é se você começar pelo lugar errado"
    - contem: "Muita gente diz"
      tipo: motion
      roteiro: {titulo: caro, modelo: produto, cenas: [{tipo: mar, dur: 3.8, ondas: false, pilares: [], rotulo: "MUITA GENTE DIZ",
                titulo: "Startup é cara?|Só se começar|*pelo lugar errado.*", tam: 84, y: 660, explosao_y: 1090, explosao_t: 2.4}]}
    # os 3 passos: o mesmo fluxo de cards volta em cada passo, com o estado ativo no passo da fala
    - contem: "Primeiro, você conversa"
      tipo: motion
      roteiro: {titulo: passo1, modelo: produto, cenas: [{tipo: fluxo, dur: 4.0, rotulo: "PASSO 1 DE 3", titulo: "Converse com|*quem tem a dor.*",
                itens: [{nome: Dor, sub: "quanto ele pagaria?", ic: user, t: 0.9}, {nome: MVP, sub: "simples + feedback", ic: engr, t: 99},
                        {nome: Venda, sub: "a promessa primeiro", ic: grafico, t: 99}]}]}
    - contem: "Segundo, simplifica"
      tipo: motion
      roteiro: {titulo: passo2, modelo: produto, cenas: [{tipo: fluxo, dur: 3.6, rotulo: "PASSO 2 DE 3", titulo: "Simplifique|*antes de escalar.*",
                itens: [{nome: Dor, sub: "quanto ele pagaria?", ic: user, t: 99}, {nome: MVP, sub: "simples + feedback", ic: engr, t: 0.8},
                        {nome: Venda, sub: "a promessa primeiro", ic: grafico, t: 99}]}]}
    - contem: "terceiro, tenta vender"
      tipo: motion
      roteiro: {titulo: passo3, modelo: produto, cenas: [{tipo: fluxo, dur: 3.8, rotulo: "PASSO 3 DE 3", titulo: "Venda *antes de construir.*",
                itens: [{nome: Dor, sub: "quanto ele pagaria?", ic: user, t: 99}, {nome: MVP, sub: "simples + feedback", ic: engr, t: 99},
                        {nome: Venda, sub: "a promessa primeiro", ic: grafico, t: 1.1}]}]}
    - contem: "Errei e gastei"
      tipo: motion
      roteiro: {titulo: errei, modelo: produto, cenas: [{tipo: mar, dur: 2.6, ondas: false, pilares: [], rotulo: "EU QUERIA TER FEITO ISSO ANTES",
                titulo: "Errei e gastei|*muito mais.*", tam: 100, y: 720, explosao_y: 1060, explosao_t: 1.2}]}
    # CTA: "Já me segue, me manda mensagem no direct falando errei"
    - contem: "me manda mensagem"
      tipo: motion
      roteiro: {titulo: cta, modelo: produto, cenas: [{tipo: mar, dur: 3.0, ondas: false, rotulo: "QUER TESTAR SUA IDEIA?",
                titulo: "Manda *“errei”*|no direct.", tam: 100, y: 700, explosao_y: 1010, explosao_t: 1.6, pilares: ["Segue", "Direct", "Errei"]}]}
cor: {look: azul_cinema}
