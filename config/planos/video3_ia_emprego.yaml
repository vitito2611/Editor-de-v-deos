# Plano do vídeo "1007 (3)" — "A IA vai roubar o teu emprego?" — estilo referencia1.
# Uso: python editar.py entrada/video3.mov --estilo referencia1 --plataforma reels --config config/planos/video3_ia_emprego.yaml
# Cliente: tudo que foi combinado (legenda branca Rubik Bold + destaque Black Jack, troca de plano <= 2,6 s,
# SFX nível v2 sem "plin", duas versões) e, NO LUGAR DE FOTOS, vídeos em motion (HyperFrames, estilo do exemplo).
# edição aprovada congelada: o Mac (4K) usa a mesma transcrição e os mesmos cortes da versão aprovada
congelado: config/planos/video3_ia_emprego_congelado.json
transcricao:
  # "Zeal" = empresa do cliente (corrigido por ele no estúdio: "A Zeal não veio pra substituir o dentista")
  correcoes: {"Iá": "IA", "Ayá": "IA", "I": "Zeal", "Iar": "IA", "ar": "IA", "As": "A", "Nasil": "Na Zeal", "concordo100%": "concordo 100%"}
cortes:
  jump_zoom: {ativo: true, modo: variado, zoom_niveis: [1.0, 1.1, 1.04, 1.16, 1.07], dividir_max_s: 2.6}
legendas:
  estilos:
    cinetico: {posicao: peito}          # frase de impacto do ref1 sem cobrir a boca
sfx:                                    # nível aprovado na v2
  intervalo_min_s: 0.9
  max_por_minuto: 30
  volume_rel_voz_db: -9
silencio:
  pausa_preservada_s: 0.22
motion:
  contador: {ativo: false}              # números entram como motion (HyperFrames)
dinamismo:
  ativo: true
  intervalo_s: 2.6
  gap_min_s: 0.9
  auto_palavras: false                  # nada de foto/B-roll genérico: só o plano
  fotos_entidades: false
  cards_max: 1
  plano:
    # v4 (pedido do cliente: "nível cinema", menos texto, mais animação, formatos bons, zona segura do Reels):
    # cenas 3D (Three.js, modelo cinema3d) + formatos que misturam a filmagem com a animação (Remotion).
    - contem: "Alguns empregos"
      tipo: motion
      roteiro: {titulo: empregos, modelo: cinema3d, cenas: [{tipo: vidros, texto: "Alguns vão|*sumir.*", ficam: [1, 3, 7], dur: 2.6}]}
    - contem: "repetição"
      tipo: motion
      roteiro: {titulo: repeticao, modelo: cinema3d, cenas: [{tipo: esteira, texto: "Repetição.", dur: 2.8}]}
    - contem: "ele multiplica"
      tipo: efeito
      efeito: multiplica          # o cliente vira uma grade de clones (×10)
      texto: "×10"
      dur: 2.4
    - contem: "em uma hora"
      tipo: motion
      roteiro: {titulo: hora, modelo: cinema3d, cenas: [{tipo: relogio, texto: "*1 hora.*", dur: 2.8}]}
    - contem: "veio para somar"
      tipo: motion
      formato: janela             # o rosto do cliente num círculo encontra o orbe da IA e os dois se fundem
      janela:
        foco: [0.5, 0.33]
        quadros:
          - {t: 0.0, x: 0.5, y: 0.5, w: 1.0, h: 1.0, r: 0.0}
          - {t: 0.45, x: 0.27, y: 0.48, w: 0.36, h: 0.2025, r: 0.5}
          - {t: 0.85, x: 0.29, y: 0.48, w: 0.36, h: 0.2025, r: 0.5}
          - {t: 1.2, x: 0.5, y: 0.48, w: 0.2, h: 0.1125, r: 0.5, o: 0.9}
          - {t: 1.3, x: 0.5, y: 0.48, w: 0.14, h: 0.079, r: 0.5, o: 0.0}
      roteiro: {titulo: somar, modelo: cinema3d, cenas: [{tipo: orbe, texto: "*somar.*", junta: 1.2, orbe_x: 0.62, dur: 2.6}]}
    - contem: "um assistente"
      tipo: motion
      formato: janela             # o cliente fica numa janela no alto à direita; o celular 3D trabalha à esquerda
      janela:
        foco: [0.5, 0.32]
        quadros:
          - {t: 0.0, x: 0.5, y: 0.5, w: 1.0, h: 1.0, r: 0.0}
          - {t: 0.5, x: 0.64, y: 0.37, w: 0.42, h: 0.27, r: 0.12}
      roteiro:
        titulo: assistente
        modelo: cinema3d
        cenas:
          - tipo: celular3d
            cel_x: 0.3
            cel_y: 0.57
            cel_escala: 0.85
            app: "Zeal IA"
            falas: [[pac, "Como explico o implante pro paciente?"], [ia, "Mostre o antes e depois e divida em 3 etapas."]]
            cartao: {titulo: "Plano de tratamento", linhas: [[Diagnóstico, "explicado"], [Proposta, "3 etapas"]]}
            cartao_t: 2.3
            dur: 4.6
    - contem: "totalmente editado"
      tipo: efeito
      efeito: monitor             # o cliente encolhe para dentro de um editor de vídeo que se monta sozinho
      texto: "100% IA"
      dur: 2.4
cor: {look: azul_cinema}               # cliente: azul cinematográfico, não o tom quente
estudio:
  # ajustes aprovados no estúdio (doc edicao/atual em 12/10): look 63%, contraste 0,20, exposição −0,39
  alteracoes: config/planos/video3_ia_emprego_estudio.json
