# Plano do vídeo "1007 (3)" — "A IA vai roubar o teu emprego?" — estilo referencia1.
# Uso: python editar.py entrada/video3.mov --estilo referencia1 --plataforma reels --config config/planos/video3_ia_emprego.yaml
# Cliente: tudo que foi combinado (legenda branca Rubik Bold + destaque Black Jack, troca de plano <= 2,6 s,
# SFX nível v2 sem "plin", duas versões) e, NO LUGAR DE FOTOS, vídeos em motion (HyperFrames, estilo do exemplo).
transcricao:
  # "Zeal" = empresa do cliente (corrigido por ele no estúdio: "A Zeal não veio pra substituir o dentista")
  correcoes: {"Iá": "IA", "Ayá": "IA", "I": "Zeal", "Iar": "IA", "ar": "IA", "As": "A", "Nasil": "Na Zeal", "concordo100%": "concordo 100%"}
cortes:
  jump_zoom: {ativo: true, modo: variado, zoom_niveis: [1.0, 1.1, 1.04, 1.16, 1.07], dividir_max_s: 2.6}
legendas:
  estilos:
    cinetico: {posicao: peito}          # frase de impacto do ref1 sem cobrir a boca
sfx:                                    # nível aprovado na v2
  intervalo_min_s: 0.9
  max_por_minuto: 30
  volume_rel_voz_db: -9
silencio:
  pausa_preservada_s: 0.22
motion:
  contador: {ativo: false}              # números entram como motion (HyperFrames)
dinamismo:
  ativo: true
  intervalo_s: 2.6
  gap_min_s: 0.9
  auto_palavras: false                  # nada de foto/B-roll genérico: só o plano
  fotos_entidades: false
  cards_max: 1
  plano:
    # motions no modelo "cinema" (pedido do cliente: escuro, fluido, com ilustrações e exemplos — não só letras)
    - contem: "Alguns empregos"
      tipo: motion
      roteiro: {titulo: empregos, cenas: [{tipo: cards_somem, titulo: "Alguns empregos *vão sumir*", ficam: [1, 4, 8], dur: 2.6}]}
    - contem: "repetição"
      tipo: motion
      roteiro: {titulo: repeticao, cenas: [{tipo: engrenagens, titulo: "Repetição. Tarefa *mecânica.*", tarefas: [Copiar, Colar, Repetir], dur: 2.8}]}
    - contem: "ele multiplica"
      tipo: motion
      roteiro: {titulo: multiplica, cenas: [{tipo: multiplica, titulo: "Ele *multiplica*", fator: 10, dur: 2.4}]}
    - contem: "em uma hora"
      tipo: motion
      roteiro: {titulo: hora, cenas: [{tipo: relogio, titulo: "Em *1 hora*", antes: "Antes", antes_valor: "o dia todo", depois: "Com IA", depois_valor: "1 h", dur: 2.8}]}
    - contem: "veio para somar"
      tipo: motion
      roteiro: {titulo: somar, cenas: [{tipo: soma, titulo: "A IA veio para *somar*", a: "Você", b: "IA", resultado: "+ resultado", dur: 2.6}]}
    - contem: "um assistente"
      tipo: motion
      roteiro: {titulo: assistente, cenas: [{tipo: celular, rotulo: "Assistente de IA *por voz*", dur: 4.6,
                plano: [Diagnóstico explicado, Plano em etapas, Proposta de fechamento]}]}
    - contem: "totalmente editado"
      tipo: motion
      roteiro: {titulo: editado, cenas: [{tipo: timeline, titulo: "Editado *100% por IA*", chip: "IA", dur: 2.4}]}
cor: {look: azul_cinema}               # cliente: azul cinematográfico, não o tom quente
