# Plano do vídeo "1013" — "Como vão ser os próximos 10 anos na odontologia" — estilo referencia1 (docs/MODELO_EDICAO.md).
# Uso: python editar.py entrada/video4.mov --estilo referencia1 --plataforma reels --config config/planos/video4_10anos.yaml
# Cliente: legendas/ênfases/SFX iguais ao vídeo 3 (aprovados). Motions: 1ª rodada no modelo "campo" (reprovada);
# 2ª rodada no modelo "produto" (referencias/motion4/ref.mp4).
# Gravação em selfie (rosto ocupa a zona segura) → a headline abre num fundo preto com o orador numa janela embaixo.
transcricao:
  correcoes: {"a10": "a 10", "de90": "de 90", "que10%": "que 10%", "de100": "de 100", "de20,30": "de 20, 30",
              "dou5": "dou 5", "próximos10": "próximos 10", "Ineligência": "Inteligência", "Vitor": "Victor"}
cortes:
  jump_zoom: {ativo: true, modo: variado, zoom_niveis: [1.0, 1.07, 1.0, 1.12, 1.04], dividir_max_s: 2.6}
legendas:
  estilos:
    cinetico: {posicao: peito}
sfx:                                    # nível aprovado (vídeo 3)
  intervalo_min_s: 0.9
  max_por_minuto: 30
  volume_rel_voz_db: -9
silencio:
  pausa_preservada_s: 0.22
motion:
  contador: {ativo: false}              # números entram como motion (modelo campo)
dinamismo:
  ativo: true
  intervalo_s: 2.6
  gap_min_s: 0.9
  inicio_livre_s: 0.0                   # a headline abre o vídeo
  auto_palavras: false
  fotos_entidades: false
  cards_max: 0
  plano:
    # 2ª rodada (cliente: "não gostei dos motions, se baseie nesse novo vídeo") → modelo "produto"
    # (referencias/motion4/ref.mp4: fundo claro, palavras que escurecem, marca-texto, cards de interface, hub, listas).
    # 0) headline com o orador numa janela (sem borda; o motion desenha a sombra/cartão atrás) que abre no fim
    - t: 0.0
      tipo: motion
      formato: janela
      janela:
        borda: false
        foco: [0.5, 0.36]
        quadros:
          - {t: 0.0, x: 0.5, y: 0.6073, w: 0.8, h: 0.3125, r: 0.022}
          - {t: 2.8, x: 0.5, y: 0.6073, w: 0.8, h: 0.3125, r: 0.022}
          - {t: 3.3, x: 0.5, y: 0.5, w: 1.0, h: 1.0, r: 0.0}
      roteiro: {titulo: headline, modelo: produto, pre_roll: 0, cenas: [{tipo: headline, dur: 3.4, janela_px: [108, 866, 864, 600]}]}
    - contem: "hoje existem mais"
      tipo: motion
      roteiro: {titulo: clinicas, modelo: produto, cenas: [{tipo: clinicas, numero: 90000, dur: 2.9}]}
    - contem: "menos do que"
      tipo: motion
      roteiro: {titulo: dez, modelo: produto, cenas: [{tipo: dez, dur: 3.3}]}
    - contem: "anos de mercado"
      tipo: motion
      roteiro: {titulo: experiencia, modelo: produto, cenas: [{tipo: experiencia, dur: 2.9}]}
    # "Ele recompensa quem sabe se posicionar (34.16), quem constrói presença (35.76), quem gera percepção de valor (37.3)"
    - contem: "Ele recompensa"
      tipo: motion
      roteiro: {titulo: fluxo, modelo: produto, cenas: [{tipo: fluxo, dur: 5.6,
                itens: [{nome: Posicionar, sub: "quem você é", ic: user, t: 1.75}, {nome: Presença, sub: "ser lembrado", ic: mega, t: 3.35},
                        {nome: Valor, sub: "percepção de valor", ic: grafico, t: 4.85}]}]}
    # "dominar três coisas: marketing (57.14), gestão (57.94), inteligência artificial (58.66)"
    - contem: "dominar três coisas"
      tipo: motion
      roteiro: {titulo: hub, modelo: produto, cenas: [{tipo: hub, dur: 4.7}]}
    # "equipe grande, seja recepcionista (74.5), CRC (75.2), gerente (76.3)... não dou 5 anos (77.8)"
    - contem: "dependem de uma equipe"
      tipo: motion
      roteiro: {titulo: automacao, modelo: produto, cenas: [{tipo: automacao, dur: 7.0, virada: 5.2,
                itens: [{nome: Recepção, t: 1.85}, {nome: CRC, t: 2.55}, {nome: Gerência, t: 3.6}, {nome: Confirmações, t: 4.05}, {nome: Follow-up, t: 4.45}]}]}
    - contem: "é um mar azul"
      tipo: motion
      roteiro: {titulo: mar, modelo: produto, cenas: [{tipo: mar, dur: 3.2}]}
cor: {look: azul_cinema}
estudio:
  # sala clara + moletom branco: look azul mais leve e legenda com contorno/sombra fortes (branco sobre branco)
  alteracoes: config/planos/video4_10anos_estudio.json
