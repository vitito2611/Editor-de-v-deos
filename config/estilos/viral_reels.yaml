# Viral (Reels/TikTok): ritmo alto — troca de enquadramento a cada <= 2,6 s (punch-ins),
# B-roll/fotos/cards nos momentos-chave, legenda dinâmica SÓ EM BRANCO (varia fonte/peso/
# tamanho). Efeitos sonoros contidos: whoosh só na entrada de imagens e impacto no gancho.
# Preferências do cliente: sem cores na legenda, sem glitch, poucos efeitos sonoros.
legendas:
  estilo_base: dinamico_branco
  estilo_impacto: dinamico_branco
  rotacao: {ativo: false}
  destaque: {ativo: false}
cor: {look: vibrante}
cortes:
  jump_zoom:
    modo: variado
    zoom_niveis: [1.0, 1.16, 1.06, 1.26, 1.10]
    dividir_max_s: 2.6          # nenhum plano dura mais que isso
  transicoes:
    whip_pan: {ativo: false}
    flash_branco: {ativo: false}
    glitch: {ativo: false}      # cliente não gostou
sfx:
  humor: {ativo: false}
  punchin: false                # sem whoosh nas trocas de zoom
  riser: {ativo: false}
  impacto: {palavras: false}    # impacto só no smash cut (gancho)
  intervalo_min_s: 2.5
  max_por_minuto: 9
  volume_rel_voz_db: -12
silencio:
  # ritmo viral: pausas preservadas ficam bem curtas, e gesticular não segura a pausa
  pausa_preservada_s: 0.22
  contexto:
    continuidade_visual: {ativo: false}
dinamismo:
  ativo: true
  cards_max: 2
musica:
  humor: energetico
  volume_db: -17
  ducking_db: -11
  trocar_a_cada_s: [26, 36]     # muda de faixa no meio do vídeo (sensação de "virada")
  crossfade_s: 1.2
