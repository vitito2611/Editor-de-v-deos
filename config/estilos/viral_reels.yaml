# Viral (Reels/TikTok) — versão aprovada pelo cliente (v2 do vídeo 1):
# troca de cena a cada <= 2,6 s (punch-ins, B-roll, fotos, cards de motion), legenda dinâmica
# SÓ EM BRANCO (varia fonte/peso/tamanho), SFX nas trocas de cena, trilha energética.
# Vetos do cliente: legenda colorida; efeito "plin"/brilho (sfx.proibidos no default.yaml).
legendas:
  estilo_base: dinamico_branco
  estilo_impacto: dinamico_branco
  rotacao: {ativo: false}
  destaque: {ativo: false}
cor: {look: vibrante}
cortes:
  jump_zoom:
    modo: variado
    zoom_niveis: [1.0, 1.16, 1.06, 1.26, 1.10]
    dividir_max_s: 2.6          # nenhum plano dura mais que isso
  transicoes:
    whip_pan: {ativo: true, intervalo_min_s: 12}
    glitch: {ativo: true}
sfx:
  humor: {ativo: true}
  intervalo_min_s: 0.9
  max_por_minuto: 30
  volume_rel_voz_db: -9
silencio:
  # ritmo viral: pausas preservadas ficam bem curtas, e gesticular não segura a pausa
  pausa_preservada_s: 0.22
  contexto:
    continuidade_visual: {ativo: false}
dinamismo:
  ativo: true
musica:
  humor: energetico
  volume_db: -17
  ducking_db: -11
  trocar_a_cada_s: [26, 36]     # muda de faixa no meio do vídeo (sensação de "virada")
  crossfade_s: 1.2
