    <div id="root" data-composition-id="motion" data-start="0" data-width="__W__" data-height="__H__" data-duration="__DUR__">
      __CENAS_HTML__

    <script>
      const D = __DADOS__;
      const W = __W__, H = __H__, U = Math.min(W, H) / 1080, VERT = H >= W;
      let semente = 7;
      const rnd = () => { semente = (semente * 16807) % 2147483647; return (semente - 1) / 2147483646; };
      const tl = gsap.timeline({ paused: true });
      const EXPO = "expo.out", FLUI = "power3.inOut", SUAVE = "sine.inOut", MOLA = "back.out(1.7)";
      const NS = "http://www.w3.org/2000/svg";
      const ACENTO = getComputedStyle(document.documentElement).getPropertyValue("--acento").trim();
      const MARCA = getComputedStyle(document.documentElement).getPropertyValue("--marca").trim();

      // ------------------------------------------------------------------ utilitários de DOM
      const mk = (tag, cls, pai, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (pai) pai.appendChild(e); return e; };
      const sv = (tag, attrs, pai) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (pai) pai.appendChild(e); return e; };
      const px = (v) => v * U + "px";
      const pos = (e, x, y) => { e.style.left = px(x); e.style.top = px(y); return e; };
      // coordenadas de projeto: 1080 de largura útil centralizada; Y em unidades de 1920 (vertical) ou 1080 (horizontal)
      const X0 = (W / U - 1080) / 2, AY = H / U;
      const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
      // "*palavra*" = destaque (fonte de destaque, ciano) · "|" = quebra de linha
      function linhas(txt) {
        return String(txt || "").split("|").map((l) => esc(l.trim()).replace(/\*([^*]+)\*/g, '<span class="dest">$1</span>'));
      }
      function bloco(pai, txt, { x = 540, y = 400, tam = 96, centro = true, cls = "" } = {}) {
        const b = mk("div", "bloco" + (centro ? " centro" : "") + (cls ? " " + cls : ""), pai);
        b.style.fontSize = px(tam);
        if (centro) { b.style.left = px(X0 + x - 540); b.style.width = px(1080); } else { b.style.left = px(X0 + x); }
        b.style.top = px(y);
        linhas(txt).forEach((h) => { const m = mk("span", "mask", b); mk("span", "ln", m, h); });
        return b;
      }
      // texto sobe de dentro da máscara, linha a linha (com leve rotação, como na referência)
      function revela(b, t, { de = 1, stagger = 0.11, dur = 0.95, rot = 4 } = {}) {
        b.querySelectorAll(".ln").forEach((l, i) =>
          tl.fromTo(l, { yPercent: 115 * de, rotation: rot * de, transformOrigin: "0% 100%" },
            { yPercent: 0, rotation: 0, duration: dur, ease: EXPO }, t + i * stagger));
      }
      function rotulo(pai, txt, x, y, t, centro) {
        if (!txt) return null;
        const r = mk("div", "rotulo", pai, "<i></i><span>" + esc(txt) + "</span>");
        r.style.top = px(y);
        if (centro) { r.style.left = "50%"; r.style.transform = "translateX(-50%)"; } else r.style.left = px(X0 + x);
        tl.fromTo(r.querySelector("i"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: EXPO }, t);
        espalha(r.querySelector("span"), t + 0.05, false);

        const cy = c.y || AY * 0.58, r = 170;
        const mkO = (txt, cor, borda) => {
          const o = mk("div", "orbe-g", P, esc(txt));
          Object.assign(o.style, { width: px(r * 2), height: px(r * 2), fontSize: px(58), background: cor, border: `${3 * U}px solid ${borda}`,
            boxShadow: `0 0 ${60 * U}px ${borda}` });
          pos(o, X0 + 540 - r, cy - r);
          return o;
        };
        const a = mkO(c.a || "Você", "radial-gradient(circle at 35% 30%, #4a2a78, #1d1033)", "rgba(236,232,255,0.5)");
        const b = mkO(c.b || "IA", "radial-gradient(circle at 35% 30%, #1d6f78, #0b2a30)", ACENTO);
        const mais = mk("div", "", P, `<svg viewBox="-50 -50 100 100" width="100%" height="100%"><path d="M0 -34V34M-34 0H34" stroke="#fff" stroke-width="12" stroke-linecap="round"/></svg>`);
        Object.assign(mais.style, { position: "absolute", width: px(110), height: px(110) }); pos(mais, X0 + 485, cy - 55);
        const fus = mkO(c.resultado || "+ resultado", "radial-gradient(circle at 40% 35%, #d9fbff 0%, var(--acento) 45%, var(--marca) 100%)", "#ffffff");
        fus.style.color = "#061318"; fus.style.fontSize = px(54); fus.style.fontWeight = 900;
        const tJ = t + Math.max(0.9, d * 0.42);
        tl.fromTo(a, { x: -520 * U, opacity: 0 }, { x: -210 * U, opacity: 1, duration: 0.8, ease: EXPO }, t + 0.15);
        tl.fromTo(b, { x: 520 * U, opacity: 0 }, { x: 210 * U, opacity: 1, duration: 0.8, ease: EXPO }, t + 0.22);
        tl.fromTo(mais, { scale: 0, rotation: -180 }, { scale: 1, rotation: 0, duration: 0.6, ease: MOLA }, t + 0.45);
        tl.to([a, b], { x: 0, scale: 0.7, duration: 0.55, ease: "power3.in" }, tJ);
        tl.to(mais, { scale: 0, opacity: 0, duration: 0.3 }, tJ);
        tl.to([a, b], { opacity: 0, duration: 0.15 }, tJ + 0.5);
        tl.fromTo(fus, { scale: 0.4, opacity: 0 }, { scale: 1.12, opacity: 1, duration: 0.7, ease: "back.out(2)" }, tJ + 0.5);
        [0, 0.1, 0.2].forEach((o, i) => {
          const an = mk("div", "anel", P); Object.assign(an.style, { width: px(r * 2), height: px(r * 2) }); pos(an, X0 + 540 - r, cy - r);
          onda(an, tJ + 0.5 + o, 0.9, 2.2 + i * 0.4, 1.0);
        });
        camera(P, t, d, { s1: 1.05 });
      };

      CENAS.timeline = (c, P, t, d) => {
        const topo = c.titulo_y || AY * 0.09;
        if (c.rotulo) rotulo(P, c.rotulo, 70, topo, t + 0.05, false);
        const tb = bloco(P, c.titulo || "Editado|*100% por IA.*", { x: 70, y: topo + 50, tam: c.tamanho || 92, centro: false });
        revela(tb, t + 0.1, { dur: 0.8 });
        const jw = 940, jh = 640, jx = X0 + 70, jy = c.y || AY * 0.40;
        const j = mk("div", "janela", P, `<div class="barra-j"><i></i><i></i><i></i></div>`);
        Object.assign(j.style, { width: px(jw), height: px(jh) }); pos(j, jx, jy);
        tl.fromTo(j, { y: 120 * U, opacity: 0, rotationX: 18 }, { y: 0, opacity: 1, rotationX: 0, duration: 0.8, ease: EXPO }, t + 0.1);
        const cores = [MARCA, ACENTO, "#7c5cc4", "#3f8f86"];
        const trilhas = 4, ph = 100;
        for (let i = 0; i < trilhas; i++) {
          let x = 30, n = 0;
          while (x < jw - 80) {
            const w = Math.min(jw - 40 - x, 90 + Math.floor(rnd() * 170));
            const cl = mk("div", "clipe-j", j);
            Object.assign(cl.style, { left: px(x), top: px(90 + i * ph), width: px(w - 10), background: cores[(i + n) % 4], opacity: 0.85 });
            tl.fromTo(cl, { x: (300 + rnd() * 400) * U, opacity: 0 }, { x: 0, opacity: 0.85, duration: 0.55, ease: EXPO }, t + 0.35 + (i * 0.08) + n * 0.07);
            x += w; n++;
          }
        }
        const ag = mk("div", "", j); Object.assign(ag.style, { position: "absolute", top: px(70), width: px(4), height: px(jh - 100), background: "#fff", left: px(30),
          boxShadow: `0 0 ${16 * U}px #fff` });
        tl.fromTo(ag, { x: 0 }, { x: (jw - 70) * U, duration: d - 0.5, ease: "none" }, t + 0.4);
        const chip = mk("div", "selo", P, `<span class="okp"><span style="width:${px(18)};height:${px(18)}">${icone("ia", "#061318", 2.6)}</span></span>${esc(c.chip || "Edição automática")}`);
        pos(chip, jx + jw - 420, jy + jh + 40);
        tl.fromTo(chip, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: MOLA }, t + 0.9);
        camera(P, t, d, { s1: 1.05 });
      };

      // ------------------------------------------------------------------ transições (no intervalo [t - ov, t])
      const TRANS = {
        iris(sec, ant, t, ov) {
          const inn = sec.querySelector(".inner");
          tl.fromTo(inn, { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(75% at 50% 50%)", duration: ov, ease: "expo.inOut" }, t - ov);
          tl.set(inn, { clipPath: "none" }, t + 0.01);
          const R = Math.hypot(W, H) * 0.75;
          [[ACENTO, 0], ["#ffffff", 0.04], [MARCA, 0.08]].forEach(([cor, o]) => {
            const a = mk("div", "anel", sec);
            Object.assign(a.style, { width: R * 2 + "px", height: R * 2 + "px", left: W / 2 - R + "px", top: H / 2 - R + "px", borderColor: cor,
              borderWidth: px(cor === "#ffffff" ? 10 : 46), zIndex: 30 });
            tl.fromTo(a, { scale: 0, opacity: 0 }, { opacity: 1, duration: 0.01 }, t - ov + o);
            tl.fromTo(a, { scale: 0 }, { scale: 1, duration: ov, ease: "expo.inOut", immediateRender: false }, t - ov + o);
            tl.to(a, { opacity: 0, duration: 0.2 }, t - 0.1 + o);
          });
          if (ant) tl.to(ant.querySelector(".inner"), { scale: 1.18, duration: ov, ease: "power2.in" }, t - ov);
        },
        listras(sec, ant, t, ov) {
          const box = mk("div", "listras", sec);
          box.style.transform = "rotate(-28deg)";
          const cores = [ACENTO, MARCA, "#ffffff", ACENTO, "#2a1446", MARCA, ACENTO, "#ffffff"];
          const inn = sec.querySelector(".inner");
          tl.set(inn, { opacity: 0 }, t - ov);
          tl.set(inn, { opacity: 1 }, t - ov / 2);
          cores.forEach((cor, i) => {
            const l = mk("div", "listra", box);
            l.style.background = cor; l.style.top = px(-1320 + i * 330);
            tl.fromTo(l, { x: -3600 * U }, { x: 0, duration: ov / 2, ease: "power3.in" }, t - ov + i * 0.015);
            tl.to(l, { x: 3600 * U, duration: ov / 2, ease: "power3.out" }, t - ov / 2 + i * 0.015);
          });
        },
        chicote(sec, ant, t, ov) {
          // chicote: a cena nova entra rasgando da direita, a antiga sai pela esquerda, com riscos de luz
          // (sem filter de desfoque: no render por software ele cria artefatos e fica lento)
          const inn = sec.querySelector(".inner");
          tl.fromTo(inn, { x: W * 1.02 }, { x: 0, duration: ov, ease: "expo.inOut" }, t - ov);
          if (ant) tl.fromTo(ant.querySelector(".inner"), { x: 0 }, { x: -W * 0.7, duration: ov, ease: "expo.inOut" }, t - ov);
          const box = mk("div", "", sec);
          Object.assign(box.style, { position: "absolute", inset: 0, zIndex: 30, pointerEvents: "none" });
          for (let i = 0; i < 14; i++) {
            const r = mk("div", "", box), h = (2 + rnd() * 7) * U, w = (300 + rnd() * 700) * U;
            Object.assign(r.style, { position: "absolute", height: h + "px", width: w + "px", top: rnd() * H + "px", left: 0,
              borderRadius: h + "px", background: `linear-gradient(90deg, transparent, ${i % 3 ? ACENTO : "#ffffff"}, transparent)` });
            tl.fromTo(r, { x: W + rnd() * W * 0.5, opacity: 0 }, { x: -w - rnd() * W * 0.3, opacity: 0.9, duration: ov * 0.9, ease: "power2.inOut" }, t - ov + rnd() * ov * 0.15);
            tl.to(r, { opacity: 0, duration: 0.08 }, t - 0.08);
          }
        },
        esfera(sec, ant, t, ov) {
          const R = Math.hypot(W, H) * 0.62;
          const e = mk("div", "esfera", sec);
          Object.assign(e.style, { width: R * 2 + "px", height: R * 2 + "px", marginLeft: -R + "px", marginTop: -R + "px" });
          const inn = sec.querySelector(".inner");
          tl.set(inn, { opacity: 0 }, t - ov);
          tl.fromTo(e, { scale: 0.02, x: 160 * U, y: 260 * U }, { scale: 1.05, x: 0, y: 0, duration: ov * 0.7, ease: "expo.in" }, t - ov);
          tl.set(inn, { opacity: 1 }, t - ov * 0.32);
          tl.to(e, { scale: 2.2, opacity: 0, duration: ov * 0.5, ease: "power2.out" }, t - ov * 0.32);
        },
        dissolver(sec, ant, t, ov) {
          tl.fromTo(sec.querySelector(".inner"), { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: ov, ease: FLUI }, t - ov);
        },
      };

      // ------------------------------------------------------------------ poeira de luz (global, sempre se movendo)
      const po = document.getElementById("poeira");
      for (let i = 0; i < (D.poeira ?? 46); i++) {
        const g = mk("div", "grao", po), s = (1.5 + rnd() * 3.5) * U;
        Object.assign(g.style, { width: s + "px", height: s + "px", left: rnd() * W + "px", top: rnd() * H + "px", opacity: 0.12 + rnd() * 0.35 });
        tl.fromTo(g, { x: 0, y: 0 }, { x: (rnd() - 0.5) * 120 * U, y: -(40 + rnd() * 160) * U, duration: D.dur, ease: "none" }, 0);
      }

      function montar() {
        let ant = null;
        D.cenas.forEach((c, k) => {
          const sec = document.getElementById("c" + k);
          const P = sec.querySelector(".palco");
          // o conteúdo já entra DURANTE a transição (como na referência: nada de tela vazia depois do corte)
          // 1ª cena (motion inserido com corte seco no vídeo): começa já em movimento, sem quadro vazio
          const adianta = k === 0 ? (D.pre_roll ?? 0.3) : c.ov * 0.6;
          CENAS[c.tipo](c, P, c.t - adianta, c.dur + adianta);
          if (c.ov > 0 && TRANS[c.transicao]) TRANS[c.transicao](sec, ant, c.t, c.ov);
          ant = sec;
        });
        window.__timelines["motion"] = tl;
      }
      document.fonts.ready.then(montar);
    </script>
  </body>
</html>
