<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <title>__TITULO__</title>
    <!-- Modelo "cinema3d" do editor: cenas 3D (Three.js) com linguagem de cinema — luz de recorte, reflexos,
         névoa de profundidade, bokeh em primeiro plano, câmera sempre em movimento, partículas, grão e vinheta —
         e no máximo 1–3 palavras por cena (pedido do cliente: menos texto, mais animação, nível cinema).
         Tudo dentro da zona segura do Reels (420 px em cima/embaixo; coluna de botões à direita).
         Gerado por editor/motion_cinema3d.py. Determinístico: o 3D é desenhado a partir do tempo do HyperFrames. -->
    <script src="gsap.min.js"></script>
    <script type="importmap">{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/addons/" } }</script>
    <style>
      @font-face { font-family: "Rubik"; src: url("fonts/Rubik-Bold.ttf"); font-weight: 700; }
      @font-face { font-family: "Rubik"; src: url("fonts/Rubik-Black.ttf"); font-weight: 900; }
      @font-face { font-family: "Rubik"; src: url("fonts/Rubik-Medium.ttf"); font-weight: 500; }
      @font-face { font-family: "Noto Serif"; src: url("fonts/NotoSerif-BoldItalic.ttf"); font-weight: 700; font-style: italic; }
      __FONTE_DEST_FACE__
      :root { --acento: __ACENTO__; --marca: __MARCA__; --u: calc(min(__W__px, __H__px) / 1080); }
      html, body { margin: 0; background: __FUNDO_SOLIDO__; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: __FUNDO__; font-family: "Rubik", sans-serif; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .camada { position: absolute; inset: 0; pointer-events: none; }
      #vinheta { background: radial-gradient(ellipse 80% 70% at 50% 50%, transparent 52%, rgba(0, 0, 0, 0.62) 100%); }
      #grao { opacity: 0.075; mix-blend-mode: overlay; background-size: 256px 256px; }
      .texto { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; text-align: center;
        color: #fff; font-weight: 700; letter-spacing: -0.025em; line-height: 1.0; }
      .mask { display: block; overflow: hidden; padding: 0.08em 0.1em 0.16em; margin: -0.08em -0.1em -0.16em; }
      .ln { display: block; white-space: nowrap; text-shadow: 0 calc(6 * var(--u)) calc(40 * var(--u)) rgba(0, 0, 0, 0.55); }
      .dest { font-family: __FONTE_DEST_CSS__; color: var(--acento);
        text-shadow: 0 0 calc(30 * var(--u)) rgba(__ACENTO_RGB__, 0.6), 0 calc(6 * var(--u)) calc(40 * var(--u)) rgba(0, 0, 0, 0.5); }
      __CSS_CENA__
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="motion" data-start="0" data-width="__W__" data-height="__H__" data-duration="__DUR__">
      <canvas id="gl" width="__W__" height="__H__"></canvas>
      <div class="camada" id="extra"></div>
      __TEXTO_HTML__
      <div class="camada" id="vinheta"></div>
      <div class="camada" id="grao"></div>
    </div>
    <script>
      // ------------------------------------------------------------------ tipografia (GSAP, timeline pausada)
      const D = __DADOS__;
      const W = __W__, H = __H__, U = Math.min(W, H) / 1080;
      const tl = gsap.timeline({ paused: true });
      const PRE = D.pre_roll || 0;
      document.querySelectorAll(".texto").forEach((b) => {
        const t0 = Number(b.dataset.t || 0.15) - PRE, t1 = Number(b.dataset.sai || 99) - PRE;
        b.querySelectorAll(".ln").forEach((l, i) => {
          tl.fromTo(l, { yPercent: 118, rotation: 5, transformOrigin: "0% 100%" },
            { yPercent: 0, rotation: 0, duration: 0.9, ease: "expo.out" }, Math.max(0, t0 + i * 0.1));
          if (t1 < D.dur) tl.to(l, { yPercent: -118, duration: 0.45, ease: "power3.in" }, t1 + i * 0.05);
        });
      });
      tl.to({}, { duration: D.dur }, 0);
      // grão: ladrilho de ruído determinístico que muda a cada quadro
      (() => {
        const c = document.createElement("canvas"); c.width = c.height = 256;
        const g = c.getContext("2d"), im = g.createImageData(256, 256);
        let s = 9; const r = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
        for (let i = 0; i < 256 * 256; i++) { const v = (r() * 255) | 0; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
        g.putImageData(im, 0, 0);
        const el = document.getElementById("grao");
        el.style.backgroundImage = `url(${c.toDataURL()})`;
        const o = { f: 0 };
        tl.fromTo(o, { f: 0 }, { f: D.dur * 30, duration: D.dur, ease: "none", onUpdate: () => {
          const k = Math.floor(o.f); el.style.backgroundPosition = `${(k * 97) % 256}px ${(k * 61) % 256}px`; } }, 0);
      })();
      window.__timelines = window.__timelines || {};
      window.__timelines["motion"] = tl;
    </script>
    <script type="module">
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

      const D = __DADOS__;
      const W = __W__, H = __H__, U = Math.min(W, H) / 1080;
      const PRE = D.pre_roll || 0;
      const ACENTO = new THREE.Color("__ACENTO__"), MARCA = new THREE.Color("__MARCA__");

      // ------------------------------------------------------------------ utilitários de cena
      let semente = 7;
      const rnd = () => { semente = (semente * 16807) % 2147483647; return (semente - 1) / 2147483646; };
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const lerp = (a, b, k) => a + (b - a) * k;
      const E = {
        expo: (k) => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k)),
        inOut: (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
        in3: (k) => k * k * k,
        out3: (k) => 1 - Math.pow(1 - k, 3),
        back: (k) => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); },
        sine: (k) => -(Math.cos(Math.PI * k) - 1) / 2,
      };
      // progresso de 0→1 entre a e b com easing
      const fase = (t, a, b, e = E.inOut) => e(clamp((t - a) / Math.max(1e-6, b - a)));

      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      const scene = new THREE.Scene();
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 200);

      function texturaBrilho(cor = "#ffffff") {
        const c = document.createElement("canvas"); c.width = c.height = 128;
        const g = c.getContext("2d"), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
        gr.addColorStop(0, cor); gr.addColorStop(0.25, cor + "aa"); gr.addColorStop(1, cor + "00");
        g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
        const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
      }
      const BRILHO_BRANCO = texturaBrilho("#ffffff");
      function brilho(cor, escala, opac = 1) {
        const m = new THREE.SpriteMaterial({ map: BRILHO_BRANCO, color: cor, transparent: true, opacity: opac,
          blending: THREE.AdditiveBlending, depthWrite: false });
        const s = new THREE.Sprite(m); s.scale.setScalar(escala); return s;
      }
      // ícones (mesmos traços do modelo premium) desenhados num canvas para virar textura
      const ICONES = {
        tel: "M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z",
        chat: "M21 12a8.5 8.5 0 0 1-12.4 7.6L3 21l1.4-5.4A8.5 8.5 0 1 1 21 12z",
        grafico: "M3 3v18h18M7 15l4-4 3 3 6-7",
        user: "M12 4a4 4 0 1 1 0 8a4 4 0 1 1 0-8M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6",
        check: "M4.5 12.5l4.8 4.8L19.5 7",
        agenda: "M5.5 4.5h13a2.5 2.5 0 0 1 2.5 2.5v11.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 18.5V7a2.5 2.5 0 0 1 2.5-2.5zM3 9.5h18M8 2.5v4M16 2.5v4",
        relogio: "M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0-18M12 7v5l3.5 2",
        doc: "M7 2.5h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-17a1 1 0 0 1 1-1zM14 2.5v5h5M9 12h7M9 15.5h7M9 19h4",
        zap: "M13 2L4 14h7l-1 8 9-12h-7z",
        dente: "M7.5 3C5 3 3.5 5 3.5 7.6c0 3 1.4 4.3 1.9 7.3.4 2.6.9 6.1 2.6 6.1 1.6 0 1.6-3.6 2.3-5.4.4-1 .9-1.4 1.7-1.4s1.3.4 1.7 1.4c.7 1.8.7 5.4 2.3 5.4 1.7 0 2.2-3.5 2.6-6.1.5-3 1.9-4.3 1.9-7.3C20.5 5 19 3 16.5 3c-1.9 0-2.8 1-4.5 1S9.4 3 7.5 3z",
      };
      function texturaIcone(nome, cor = "#ffffff", tam = 256) {
        const c = document.createElement("canvas"); c.width = c.height = tam;
        const g = c.getContext("2d"); g.scale(tam / 24, tam / 24);
        g.strokeStyle = cor; g.lineWidth = 1.6; g.lineCap = "round"; g.lineJoin = "round";
        g.stroke(new Path2D(ICONES[nome] || ICONES.zap));
        const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
      }
      // bokeh de primeiro plano: discos suaves grandes, perto da câmera (profundidade de campo)
      function bokeh(n, raio, zMin, zMax, cores) {
        const g = new THREE.Group();
        for (let i = 0; i < n; i++) {
          const s = brilho(cores[i % cores.length], raio * (0.6 + rnd() * 0.8), 0.10 + rnd() * 0.16);
          s.position.set((rnd() - 0.5) * 6, (rnd() - 0.5) * 10, zMin + rnd() * (zMax - zMin));
          s.userData.v = new THREE.Vector3((rnd() - 0.5) * 0.25, 0.15 + rnd() * 0.25, 0);
          s.userData.p0 = s.position.clone();
          g.add(s);
        }
        g.userData.mover = (t) => g.children.forEach((s) => s.position.copy(s.userData.p0).addScaledVector(s.userData.v, t));
        return g;
      }
      function poeira(n, area, cor, tam = 0.025) {
        const geo = new THREE.BufferGeometry(), pos = new Float32Array(n * 3);
        for (let i = 0; i < n; i++) { pos[i * 3] = (rnd() - 0.5) * area[0]; pos[i * 3 + 1] = (rnd() - 0.5) * area[1]; pos[i * 3 + 2] = (rnd() - 0.5) * area[2]; }
        geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        const m = new THREE.PointsMaterial({ color: cor, size: tam, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending,
          depthWrite: false, map: BRILHO_BRANCO, sizeAttenuation: true });
        return new THREE.Points(geo, m);
      }
      const ctx = { THREE, scene, camera, renderer, rnd, clamp, lerp, E, fase, brilho, texturaIcone, bokeh, poeira, RoundedBoxGeometry,
        ACENTO, MARCA, W, H, U, D };

      // ------------------------------------------------------------------ cena
      __CENA_JS__

      await document.fonts.ready;   // textos desenhados em canvas (tela do celular) usam a Rubik
      const desenhar = montarCena(ctx);
      const renderAt = (t) => { desenhar(t + PRE); renderer.render(scene, camera); };
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
