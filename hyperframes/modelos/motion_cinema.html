<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <title>__TITULO__</title>
    <!-- Modelo "cinema" de motion do editor (pedido do cliente no vídeo 3): paleta escura azul/ciano,
         movimento fluido (easings longos, sobreposição, câmera sempre em leve movimento) e ILUSTRAÇÕES
         animadas por cena — não só texto. Fontes: Rubik (texto) + fonte de destaque do cliente.
         Gerado por editor/motion_hf.py. Sem filter: blur grande (render por software fica lento). -->
    <script src="gsap.min.js"></script>
    <style>
      @font-face { font-family: "Rubik"; src: url("fonts/Rubik-Medium.ttf"); font-weight: 500; }
      @font-face { font-family: "Rubik"; src: url("fonts/Rubik-Bold.ttf"); font-weight: 700; }
      @font-face { font-family: "Rubik"; src: url("fonts/Rubik-Black.ttf"); font-weight: 900; }
      @font-face { font-family: "Noto Serif"; src: url("fonts/NotoSerif-BoldItalic.ttf"); font-weight: 700; font-style: italic; }
      @font-face { font-family: "Noto Serif"; src: url("fonts/NotoSerif-Bold.ttf"); font-weight: 700; }
      __FONTE_DEST_FACE__
      :root {
        --fundo: __FUNDO__; --texto: __TEXTO__; --acento: __ACENTO__;
        --g1: __G1__; --g2: __G2__; --g3: __G3__;
        --painel: rgba(255, 255, 255, 0.06); --borda: rgba(160, 200, 255, 0.18); --suave: rgba(220, 232, 255, 0.62);
        --u: calc(min(__W__px, __H__px) / 1080);
      }
      html, body { margin: 0; background: var(--fundo); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--fundo);
        font-family: "Rubik", sans-serif; font-weight: 700; color: var(--texto); }
      .camada { position: absolute; inset: 0; }
      .aurora { position: absolute; border-radius: 50%; }
      #vinheta { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0, 0, 0, 0.55) 100%); }
      .clip { position: absolute; inset: 0; }
      .palco { position: absolute; inset: 0; }
      .titulo { position: absolute; left: 8%; right: 8%; top: var(--ty, 18%); display: flex; flex-wrap: wrap; justify-content: center;
        column-gap: calc(20 * var(--u)); row-gap: calc(6 * var(--u)); font-size: calc(var(--tam, 92) * var(--u)); line-height: 1.08;
        letter-spacing: -0.015em; text-align: center; }
      .m { display: inline-block; overflow: hidden; padding: 0 0.04em 0.12em; margin-bottom: -0.12em; }
      .p { display: inline-block; }
      .dest { font-family: __FONTE_DEST_CSS__; color: var(--acento); }
      .sub, .tarefa { position: absolute; left: 10%; right: 10%; text-align: center; font-weight: 500; color: var(--suave);
        font-size: calc(44 * var(--u)); }
      .ilu { position: absolute; left: 50%; top: var(--iy, 58%); width: calc(var(--iw, 860) * var(--u)); height: calc(var(--ih, 860) * var(--u));
        margin-left: calc(var(--iw, 860) * var(--u) / -2); margin-top: calc(var(--ih, 860) * var(--u) / -2); }
      .ilu svg { width: 100%; height: 100%; overflow: visible; }
      /* cartões de tarefa */
      .card { position: absolute; width: calc(250 * var(--u)); height: calc(170 * var(--u)); border-radius: calc(26 * var(--u));
        background: var(--painel); border: 1px solid var(--borda); box-sizing: border-box; padding: calc(24 * var(--u)); }
      .card .ic { width: calc(46 * var(--u)); height: calc(46 * var(--u)); border-radius: calc(12 * var(--u)); background: var(--g2); opacity: 0.9; }
      .card .ln { height: calc(14 * var(--u)); border-radius: calc(7 * var(--u)); background: rgba(220, 232, 255, 0.28); margin-top: calc(16 * var(--u)); }
      .card .ln.c { width: 60%; }
      .card.fica { border-color: var(--acento); background: rgba(94, 200, 255, 0.12); }
      .card.fica .ic { background: var(--acento); }
      /* barras de comparação */
      .barra { position: absolute; left: 0; height: calc(86 * var(--u)); border-radius: calc(43 * var(--u)); }
      .rot { position: absolute; left: 0; font-size: calc(40 * var(--u)); font-weight: 500; color: var(--suave); }
      .val { position: absolute; font-size: calc(46 * var(--u)); font-weight: 900; color: var(--texto); }
      /* celular */
      .celular { position: absolute; left: 50%; top: 50%; width: calc(560 * var(--u)); height: calc(1120 * var(--u));
        margin-left: calc(-280 * var(--u)); margin-top: calc(-560 * var(--u)); border-radius: calc(84 * var(--u));
        background: #05070d; padding: calc(16 * var(--u)); box-sizing: border-box;
        box-shadow: 0 0 0 calc(3 * var(--u)) rgba(160, 200, 255, 0.25), 0 calc(50 * var(--u)) calc(120 * var(--u)) rgba(0, 0, 0, 0.6); }
      .tela { position: relative; width: 100%; height: 100%; border-radius: calc(70 * var(--u)); overflow: hidden;
        background: linear-gradient(170deg, #0e1730 0%, #0a1020 60%, #0b1a2a 100%); }
      .ilha { position: absolute; top: calc(24 * var(--u)); left: 50%; width: calc(160 * var(--u)); height: calc(44 * var(--u));
        margin-left: calc(-80 * var(--u)); border-radius: calc(22 * var(--u)); background: #000; }
      .app { position: absolute; inset: 0; padding: calc(110 * var(--u)) calc(34 * var(--u)) calc(40 * var(--u)); box-sizing: border-box;
        display: flex; flex-direction: column; gap: calc(20 * var(--u)); }
      .app-topo { display: flex; align-items: center; gap: calc(14 * var(--u)); font-size: calc(32 * var(--u)); }
      .orb { width: calc(54 * var(--u)); height: calc(54 * var(--u)); border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #bfe9ff, var(--acento) 45%, #1b3f9e 100%); }
      .onda { display: flex; align-items: center; justify-content: center; gap: calc(8 * var(--u)); height: calc(120 * var(--u)); }
      .onda i { display: block; width: calc(12 * var(--u)); height: calc(100 * var(--u)); border-radius: calc(6 * var(--u)); background: var(--acento); }
      .bolha { max-width: 84%; font-size: calc(27 * var(--u)); font-weight: 500; line-height: 1.3; padding: calc(16 * var(--u)) calc(20 * var(--u));
        border-radius: calc(24 * var(--u)); }
      .bolha.eu { align-self: flex-end; background: var(--acento); color: #04101f; border-bottom-right-radius: calc(6 * var(--u)); }
      .bolha.ia { align-self: flex-start; background: var(--painel); border: 1px solid var(--borda); border-bottom-left-radius: calc(6 * var(--u)); }
      .plano { border-radius: calc(24 * var(--u)); background: rgba(94, 200, 255, 0.08); border: 1px solid var(--borda); padding: calc(20 * var(--u));
        font-size: calc(26 * var(--u)); display: flex; flex-direction: column; gap: calc(12 * var(--u)); }
      .item { display: flex; align-items: center; gap: calc(12 * var(--u)); font-weight: 500; }
      .ok { width: calc(30 * var(--u)); height: calc(30 * var(--u)); border-radius: 50%; background: var(--acento); flex: none; }
      /* timeline de edição */
      .trilha { position: absolute; left: 0; right: 0; height: calc(70 * var(--u)); border-radius: calc(14 * var(--u)); background: rgba(255, 255, 255, 0.04); }
      .clipe { position: absolute; top: calc(8 * var(--u)); bottom: calc(8 * var(--u)); border-radius: calc(10 * var(--u)); }
      .agulha { position: absolute; top: calc(-30 * var(--u)); width: calc(4 * var(--u)); background: #ffffff; border-radius: 2px; }
      .chip { position: absolute; padding: calc(12 * var(--u)) calc(24 * var(--u)); border-radius: calc(40 * var(--u)); font-size: calc(34 * var(--u));
        background: var(--acento); color: #04101f; font-weight: 900; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="motion" data-start="0" data-width="__W__" data-height="__H__" data-duration="__DUR__">
      <div class="camada" id="fundo"><div class="aurora" id="a1"></div><div class="aurora" id="a2"></div><div class="aurora" id="a3"></div></div>
      __CENAS_HTML__
      <div id="vinheta"></div>
    </div>
    <script>
      const DADOS = __DADOS__;
      const W = __W__, H = __H__, U = Math.min(W, H) / 1080;
      let semente = 11;
      const rnd = () => { semente = (semente * 16807) % 2147483647; return (semente - 1) / 2147483646; };
      const tl = gsap.timeline({ paused: true });
      const FLUI = "power3.inOut", SAI = "power2.in", ENTRA = "expo.out";

      // ---------- fundo: aurora azul que respira o tempo todo (sem filter: blur — gradiente radial pronto)
      [["#a1", "--g1", 0.2, 0.25, 1.1], ["#a2", "--g2", 0.85, 0.7, 0.95], ["#a3", "--g3", 0.4, 1.0, 0.9]].forEach(([sel, cor, x, y, s], i) => {
        const el = document.querySelector(sel), d = Math.max(W, H) * s;
        Object.assign(el.style, { width: d + "px", height: d + "px", left: (x * W - d / 2) + "px", top: (y * H - d / 2) + "px",
          background: `radial-gradient(closest-side, var(${cor}) 0%, transparent 100%)`, opacity: 0.55 });
        tl.fromTo(el, { x: 0, y: 0, scale: 1 }, { x: (i - 1) * 90 * U, y: (i % 2 ? 1 : -1) * 70 * U, scale: 1.15,
          duration: DADOS.dur, ease: "sine.inOut" }, 0);
      });

      DADOS.cenas.forEach((c, k) => {
        const t0 = c.t, d = c.dur;
        const sec = document.getElementById("c" + k);
        const el = (s) => sec.querySelector(s);
        const all = (s) => Array.from(sec.querySelectorAll(s));
        const palco = el(".palco");
        // câmera sempre viva: leve aproximação contínua durante a cena (fluidez)
        tl.fromTo(palco, { scale: 1.0, y: 0 }, { scale: 1.045, y: -18 * U, duration: d, ease: "none" }, t0);
        // entrada da cena
        tl.fromTo(palco, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, t0);
        // título: cada palavra sobe de dentro de uma máscara, em onda
        all(".p").forEach((p, i) => tl.fromTo(p, { yPercent: 105, rotation: 4 }, { yPercent: 0, rotation: 0, duration: 0.9, ease: ENTRA }, t0 + 0.08 + i * 0.065));
        const sub = el(".sub");
        if (sub) tl.fromTo(sub, { opacity: 0, y: 24 * U }, { opacity: 1, y: 0, duration: 0.8, ease: ENTRA }, t0 + 0.45);
        // saída: tudo sobe e some junto, suave (sem corte seco interno)
        tl.to(palco, { opacity: 0, y: -60 * U, duration: 0.45, ease: SAI }, t0 + d - 0.45);

        if (c.tipo === "cards_somem") {
          const cards = all(".card");
          cards.forEach((cd, i) => tl.fromTo(cd, { opacity: 0, y: 60 * U, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: ENTRA }, t0 + 0.2 + i * 0.05));
          cards.filter((cd) => !cd.classList.contains("fica")).forEach((cd, i) => {
            const ang = (rnd() - 0.5) * 50;
            tl.to(cd, { opacity: 0, y: -(140 + rnd() * 120) * U, x: (rnd() - 0.5) * 160 * U, rotation: ang, scale: 0.7,
              duration: 1.1, ease: FLUI }, t0 + d * 0.45 + i * 0.06);
          });
          cards.filter((cd) => cd.classList.contains("fica")).forEach((cd) =>
            tl.to(cd, { scale: 1.12, duration: 0.9, ease: FLUI }, t0 + d * 0.5));
        } else if (c.tipo === "engrenagens") {
          all(".gear").forEach((g, i) => {
            tl.fromTo(g, { scale: 0.4, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.8, ease: ENTRA }, t0 + 0.15 + i * 0.12);
            tl.fromTo(g, { rotation: 0 }, { rotation: (i % 2 ? -1 : 1) * 200, duration: d, ease: "none", transformOrigin: "50% 50%" }, t0);
          });
          // tarefas em fila: uma sai antes da próxima entrar (sem sobrepor)
          const tfs = all(".tarefa");
          const passoT = (d - 1.0) / Math.max(1, tfs.length);
          tfs.forEach((tf, i) => {
            const s = t0 + 0.5 + i * passoT;
            tl.fromTo(tf, { opacity: 0, x: -50 * U }, { opacity: 1, x: 0, duration: 0.28, ease: ENTRA }, s);
            if (i < tfs.length - 1) tl.to(tf, { opacity: 0, x: 50 * U, duration: 0.22, ease: SAI }, s + passoT - 0.24);
          });
        } else if (c.tipo === "multiplica") {
          const lin = all(".lig"), nos = all(".no");
          tl.fromTo(el(".no0"), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.6, ease: "back.out(2)" }, t0 + 0.15);
          lin.forEach((l, i) => {
            const len = l.getTotalLength();
            l.setAttribute("stroke-dasharray", len);
            tl.fromTo(l, { attr: { "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.55, ease: FLUI },
              t0 + 0.45 + Number(l.dataset.n) * 0.42 + (i % 6) * 0.03);
          });
          nos.forEach((n) => tl.fromTo(n, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.45, ease: "back.out(2.2)" },
            t0 + 0.75 + Number(n.dataset.n) * 0.42 + rnd() * 0.12));
          const cont = el(".contador");
          if (cont) {
            const o = { v: 1 };
            tl.to(o, { v: c.fator || 10, duration: d * 0.6, ease: "power2.inOut", onUpdate: () => { cont.textContent = "×" + Math.round(o.v); } }, t0 + 0.4);
          }
        } else if (c.tipo === "relogio") {
          tl.fromTo(el(".ponteiro"), { rotation: 0, svgOrigin: "200 200" }, { rotation: 360 * 8, duration: d * 0.75, ease: "power2.inOut", svgOrigin: "200 200" }, t0 + 0.3);
          tl.fromTo(el(".arco"), { attr: { "stroke-dashoffset": 1131 } }, { attr: { "stroke-dashoffset": 0 }, duration: d * 0.75, ease: "power2.inOut" }, t0 + 0.3);
          const [b1, b2] = all(".barra");
          tl.fromTo(b1, { width: 0 }, { width: 860 * U, duration: 1.4, ease: FLUI }, t0 + 0.5);
          tl.fromTo(b2, { width: 0 }, { width: 108 * U, duration: 0.7, ease: ENTRA }, t0 + 1.2);
          all(".val, .rot").forEach((v, i) => tl.fromTo(v, { opacity: 0 }, { opacity: 1, duration: 0.5 }, t0 + 0.6 + i * 0.12));
        } else if (c.tipo === "soma") {
          const [a, b] = all(".bola");
          tl.fromTo(a, { x: -250 * U, opacity: 0 }, { x: -150 * U, opacity: 1, duration: 0.8, ease: ENTRA }, t0 + 0.15);
          tl.fromTo(b, { x: 250 * U, opacity: 0 }, { x: 150 * U, opacity: 1, duration: 0.8, ease: ENTRA }, t0 + 0.25);
          tl.fromTo(el(".mais"), { scale: 0, rotation: -90, transformOrigin: "50% 50%" }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(2)" }, t0 + 0.6);
          tl.to([a, b], { x: 0, duration: 0.9, ease: FLUI }, t0 + d * 0.48);
          tl.to(all(".bola text"), { opacity: 0, duration: 0.3, ease: SAI }, t0 + d * 0.48);   // nomes somem antes de se encontrarem
          tl.to(el(".mais"), { scale: 0, opacity: 0, duration: 0.4, ease: SAI }, t0 + d * 0.48);
          tl.fromTo(el(".fusao"), { scale: 0.3, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.8, ease: "back.out(1.6)" }, t0 + d * 0.48 + 0.6);
          tl.to([a, b], { opacity: 0, duration: 0.3 }, t0 + d * 0.48 + 0.6);
        } else if (c.tipo === "celular") {
          tl.fromTo(el(".celular"), { y: 700 * U, rotation: -6 }, { y: 0, rotation: 0, duration: 1.1, ease: ENTRA }, t0 + 0.05);
          tl.to(el(".celular"), { y: -20 * U, rotation: 1.5, duration: d - 1.2, ease: "sine.inOut" }, t0 + 1.15);
          all(".onda i").forEach((b, i) => tl.fromTo(b, { scaleY: 0.15 }, { scaleY: 0.3 + 0.7 * Math.abs(Math.sin(i * 1.9)), duration: 0.26,
            ease: "sine.inOut", repeat: Math.max(1, Math.floor((d - 1.0) / 0.26)), yoyo: true }, t0 + 0.8 + i * 0.025));
          const passo = Math.max(0.5, (d - 1.6) / Math.max(1, all(".passo").length));
          all(".passo").forEach((m, i) => tl.fromTo(m, { opacity: 0, y: 30 * U, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: ENTRA },
            t0 + 1.0 + i * passo));
          all(".item").forEach((it, i) => tl.fromTo(it, { opacity: 0, x: -20 * U }, { opacity: 1, x: 0, duration: 0.4, ease: ENTRA },
            t0 + 1.0 + (all(".passo").length - 1) * passo + 0.35 + i * 0.22));
        } else if (c.tipo === "timeline") {
          all(".clipe").forEach((cl, i) => tl.fromTo(cl, { scaleX: 0, transformOrigin: "0% 50%", opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.55, ease: ENTRA },
            t0 + 0.3 + i * 0.12));
          tl.fromTo(el(".agulha"), { x: 0 }, { x: 860 * U, duration: d - 0.6, ease: "none" }, t0 + 0.3);
          tl.fromTo(el(".chip"), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.6, ease: "back.out(2)" }, t0 + 0.9);
          tl.to(el(".chip"), { scale: 1.08, duration: 0.5, yoyo: true, repeat: Math.max(1, Math.floor((d - 1.6) / 0.5)), ease: "sine.inOut" }, t0 + 1.5);
        }
      });
      window.__timelines["motion"] = tl;
    </script>
  </body>
</html>
